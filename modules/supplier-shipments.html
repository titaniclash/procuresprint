<!-- Module landing · archetype: Workbench · generated from build/pages_c.py -->

<main id="main"><p class="t-body-md ink-3">Loading…</p></main>
<script src="/assets/js/ps.js"></script>
<script>

window.PAGE = {
  title: 'Shipments',
  meta: rows => `Your advance shipping notices to Mindsprint Digital plants · ${rows.filter(r => r.status === 'transit').length} on the road`,
  actions: [{ label: 'Create shipment notice', icon: 'add', kind: 'primary', href: 'supplier-asn-create.html' }],
  statuses: { draft: ['', 'Draft'], transit: ['info', 'In transit', 'local_shipping'], received: ['success', 'Received'], rejected: ['danger', 'Rejected at receipt'] },
  tiles: [
    { label: 'Rejected at receipt', icon: 'assignment_return', tone: 'danger', match: 'rejected', meta: () => 'replace or issue credit note' },
    { label: 'In transit', icon: 'local_shipping', tone: 'info', match: 'transit', meta: () => 'arriving this week' },
    { label: 'Drafts', icon: 'edit_note', match: 'draft', meta: () => 'not yet sent' },
    { label: 'Quality pass rate', icon: 'verified', static: { value: '98.2', unit: '%', meta: 'last 90 days' } },
  ],
  views: [{ label: 'All', match: '' }, { label: 'In transit', match: 'transit' }, { label: 'Received', match: 'received' }, { label: 'Rejected', match: 'rejected' }],
  tableTitle: 'Shipment notices', search: 'ASN, PO', total: 22,
  columns: [
    { key: 'id', label: 'ASN', sticky: true, render: r => H.id(r.id) },
    { key: 'po', label: 'PO' },
    { key: 'to', label: 'Ship to' },
    { key: 'disp', label: 'Dispatched' },
    { key: 'eta', label: 'Expected' },
    { key: 'status', label: 'Status', render: r => H.status(r) },
  ],
  rowAction: r => r.status === 'rejected' ? '<button class="ps-btn ps-btn--secondary ps-btn--sm" data-todo>See reason</button>' : r.status === 'draft' ? '<button class="ps-btn ps-btn--secondary ps-btn--sm" data-todo>Send</button>' : '',
  rows: [
    { id: 'ASN030000021', po: 'PO-2603148', to: 'Chennai plant', disp: '21 Nov', eta: '24 Nov', status: 'transit', tags: 'transit' },
    { id: 'ASN030000016', po: 'PO-2603020', to: 'Pune plant', disp: '14 Nov', eta: '19 Nov', status: 'received', tags: 'received' },
    { id: 'ASN030000010', po: 'PO-2602155', to: 'Pune plant', disp: '17 Nov', eta: '21 Nov', status: 'received', tags: 'received' },
    { id: 'ASN020000009', po: 'PO-2602088', to: 'Chennai plant', disp: '10 Nov', eta: '14 Nov', status: 'rejected', tags: 'rejected' },
    { id: 'ASN030000023', po: 'PO-2603102', to: 'Pune plant', disp: '—', eta: '—', status: 'draft', tags: 'draft' },
  ],
};
</script>
