  statuses: { draft: ['', 'Draft'], pending: ['warning', 'Pending Approval'], approved: ['success', 'Approved'], sourcing: ['info', 'Under Sourcing'], rejected: ['danger', 'Rejected'] },
  kpis: [
    { label: 'Total PRs', value: '1,248', icon: 'description', tone: 'info' },
    { label: 'Pending Approval', value: '312', icon: 'pending_actions', tone: 'warning', match: 'pending' },
    { label: 'Rejected', value: '28', icon: 'cancel', tone: 'danger', match: 'rejected' },
    { label: 'Converted to PO', value: '426', icon: 'shopping_cart', tone: 'success', match: 'po' },
    { label: 'Approved TAT', value: '45', unit: 'Days', icon: 'schedule', tone: 'ai' },

  tableTitle: 'Purchase Requisitions', search: 'PR number, item, requester, supplier…', total: 1248, pages: 125,

    { key: 'by', label: 'Required By' },
    { key: 'status', label: 'Status', render: r => H.status(r) },

    { key: 'po', label: 'PO Number', render: r => H.dash(r.po) },

  bulk: ['Assign buyer', 'Create RFx', 'Export selected', 'Withdraw'],
  rows: PR.map(([id, date, who, v, co, d, items, age, cat, qty, by, status, src, po]) => ({ id, date, who, v, co, d, items, age, cat, qty, by, status, src, po, tags: `${TAG[status]}${po !== '-' ? ' po' : ''}` })),
  rowMenu: r => [
    { label: 'View details', icon: 'visibility', preview: r.id },
    r.status === 'draft' ? { label: 'Edit draft', icon: 'edit', href: 'pr-create.html' } : null,
    r.status === 'approved' && r.po === '-' ? { label: 'Create PO', icon: 'shopping_cart_checkout' } : null,
    r.src === 'Yes' && r.status !== 'sourcing' ? { label: 'Create RFx', icon: 'request_quote' } : null,
    r.status === 'pending' ? { label: 'Track approval', icon: 'account_tree' } : null,
    { label: 'Copy PR', icon: 'content_copy', toast: `Copy of ${r.id} saved as draft` },
    { label: 'Download PDF', icon: 'download', toast: `${r.id}.pdf downloaded` },
    ['pending', 'draft'].includes(r.status) ? '-' : null,
    ['pending', 'draft'].includes(r.status) ? { label: 'Withdraw PR', icon: 'undo', danger: true } : null,
  ],
  preview: {
    title: r => `${r.id} · ${r.cat}`, sub: r => `${r.who} · ${r.d} · ${r.co}`,
    fields: [['Estimated value', r => '₹ ' + inr(r.v)], ['PR date', r => esc(r.date)], ['Required by', r => esc(r.by)], ['Items · Quantity', r => `${r.items} · ${r.qty}`], ['PR ageing', r => esc(r.age)], ['Sourcing required', r => esc(r.src)], ['PO number', r => H.dash(r.po)]],
    timelineTitle: 'Progress',
    timeline: r => [[r.status === 'draft' ? 'now' : 'done', r.status === 'draft' ? 'Draft' : `Submitted by ${r.who}`, r.date], [['approved'].includes(r.status) || r.status === 'sourcing' ? 'done' : r.status === 'pending' ? 'now' : '', 'Approval', r.status === 'rejected' ? 'Rejected' : r.status === 'pending' ? 'Pending Approval' : ''], [r.status === 'sourcing' ? 'now' : r.po !== '-' ? 'done' : '', r.src === 'Yes' ? 'Sourcing' : 'Purchase order', r.po !== '-' ? r.po : r.status === 'sourcing' ? 'Under Sourcing' : 'Not started']],
    primary: r => r.status === 'approved' && r.po === '-' ? 'Create PO' : r.status === 'draft' ? 'Edit draft' : '',
    primaryHref: r => r.status === 'draft' ? 'pr-create.html' : '',
    record: r => r.id === 'PR-2025-00123' ? 'pr-detail.html' : '',
  },
  note: 'Content from Figma “PR Workbench”. Card and tab totals are Figma figures for the full dataset; the grid shows page 1 (10 rows).',
};
