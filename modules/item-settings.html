<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Item master settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=swap">
<link rel="stylesheet" href="/src/styles/tokens.css">
<link rel="stylesheet" href="/src/styles/ps.css">
</head>
<!-- Admin · Item master settings (BRD S11). Five sections as tabs: Item Field Configuration, Item Sequencing, Item ERP Sync, Item Management Audit, General Settings. -->
<body data-shell="buyer" data-root=".." data-group="items" data-module="item-settings" data-crumbs="Administration|Item master settings">
<main id="main"><p class="t-body-md ink-3" aria-busy="true">Loading…</p></main>
<script src="/assets/js/ps.js"></script>
<script src="/assets/js/item-master.js"></script>
<script src="/assets/js/item-ui.js"></script>
<script>
{
  const U = IMUI, main = document.getElementById('main');
  const sec = (id, title, sub, body, act = '') => `<section class="ps-section" aria-labelledby="${id}"><div class="ps-section__head"><div><h2 class="ps-section__title" id="${id}">${title}</h2>${sub ? `<p class="ps-section__sub">${sub}</p>` : ''}</div>${act}</div><div class="ps-section__body">${body}</div></section>`;
  const tbl = (cap, head, rows) => `<div class="ps-table-scroll"><table class="ps-table"><caption class="sr-only">${cap}</caption><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td data-l="${U.esc(head[i])}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const sel = (id, list, cur, label) => `<select class="ps-select" id="${id}"${label ? ` aria-label="${U.esc(label)}"` : ''}>${list.map(x => `<option${x === cur ? ' selected' : ''}>${U.esc(x)}</option>`).join('')}</select>`;
  const field = (id, label, ctl, help) => `<div class="ps-field"><label class="ps-field__label" for="${id}">${label}</label>${ctl}${help ? `<span class="ps-field__help">${help}</span>` : ''}</div>`;
  const sw = (id, label, on, help) => `<div class="ps-field"><span class="ps-field__label" id="${id}-l">${label}</span><label class="ps-switch"><input type="checkbox" role="switch" id="${id}" aria-labelledby="${id}-l"${on ? ' checked' : ''}><span>${on ? 'On' : 'Off'}</span></label>${help ? `<span class="ps-field__help">${help}</span>` : ''}</div>`;
  const WHO = { req: 'Requester', mdm: 'MDM', fin: 'Finance', sys: 'System' };
  const EDIT = { req: 'Via update', mdm: 'MDM only', fin: 'Finance only', sys: 'No' };

  /* 1. field configuration: the 52 fields, per item type */
  const lvl = (fd, t) => !IM.appliesTo(fd, t) ? 'Hidden' : fd.level === 'M' ? 'Required' : 'Optional';
  const fieldsTab = () => sec('s1', 'Item Field Configuration', `Choose which fields show and which are required for each item type. ${IM.FIELDS.length} fields (BR12).`,
    `<div class="ps-toolbar" style="border:0;padding:0"><div class="ps-toolbar__search"><label class="sr-only" for="fq">Search fields</label><div class="ps-inputwrap"><span class="ms" aria-hidden="true">search</span><input class="ps-input" id="fq" type="search" placeholder="Search field…"></div></div><button type="button" class="ps-btn ps-btn--secondary" data-todo><span class="ms" aria-hidden="true">add</span>Add custom field</button></div>`
    + tbl('Field configuration', ['No.', 'Field', 'Section', 'Goods', 'Service', 'Asset', 'Filled by', 'Editable after approval', 'Phase'], IM.FIELDS.map(fd => [String(fd.no), `<strong>${U.esc(fd.label)}</strong>`, U.esc(fd.sec), ...['Goods', 'Service', 'Asset'].map(t => sel(`f${fd.no}${t[0]}`, ['Required', 'Optional', 'Hidden'], lvl(fd, t), `${fd.label} for ${t}`).replace('<select ', '<select style="min-width:124px" ')), WHO[fd.who], EDIT[fd.who], fd.phase])));

  /* 2. sequencing */
  const seqTab = () => sec('s2', 'Item Code Format', 'One running number per company and item type. Item codes are created only after final approval (BR39). Changes apply to the next code; existing codes never change.',
    tbl('Item code formats', ['Company', 'Item type', 'Prefix', 'Digits', 'Next code', 'Range used', 'Status', ''], [
      ['Mindsprint Digital · IN01', 'Goods', 'G-', '6', IM.newItemCode('Goods'), '0.1% of 999,999', U.chip('success', 'Active'), '<button type="button" class="ps-btn ps-btn--text ps-btn--sm" data-edit="G">Edit</button>'],
      ['Mindsprint Digital · IN01', 'Service', 'S-', '6', IM.newItemCode('Service'), '0.1% of 999,999', U.chip('success', 'Active'), '<button type="button" class="ps-btn ps-btn--text ps-btn--sm" data-edit="S">Edit</button>'],
      ['Mindsprint Digital · IN01', 'Asset', 'A-', '6', IM.newItemCode('Asset'), '0.1% of 999,999', U.chip('success', 'Active'), '<button type="button" class="ps-btn ps-btn--text ps-btn--sm" data-edit="A">Edit</button>'],
      ['Corporate Services · IN02', 'Goods', 'IT-', '4', 'IT-9124', '91% of 9,999', U.chip('warning', 'Range 90% used'), '<button type="button" class="ps-btn ps-btn--text ps-btn--sm" data-edit="IT">Edit</button>']]), '<button type="button" class="ps-btn ps-btn--secondary" data-todo><span class="ms" aria-hidden="true">add</span>Add format</button>')
    + sec('s2b', 'Edit format · Corporate Services · Goods', 'Preview updates as you type.', `<div class="ps-formgrid">${field('pfx', 'Prefix', '<input class="ps-input" id="pfx" value="IT-">')}${field('dig', 'Number of digits', sel('dig', ['4', '5', '6'], '5'), 'Raising digits from 4 to 5 adds 90,000 codes.')}${field('stf', 'Start from', '<input class="ps-input" id="stf" value="09125">')}${field('alrt', 'Alert admin at', sel('alrt', ['80% of range', '90% of range', '95% of range'], '90% of range'))}${field('blk', 'Block creation at', sel('blk', ['100% of range'], '100% of range'), 'Fixed. Creation stops with a message (EC32).')}<div class="ps-field"><span class="ps-field__label">Next code</span><strong class="t-title-md" id="nxt">IT-09125</strong><span class="ps-field__help">then IT-09126, IT-09127 …</span></div></div>`)
    + sec('s2c', 'Request Number', 'Every request gets a number on first submit.', `<div class="ps-formgrid">${field('rp', 'Prefix', '<input class="ps-input" id="rp" value="IR">')}${field('ry', 'Year', sel('ry', ['YY · 26', 'YYYY · 2026', 'None'], 'YY · 26'))}${field('rd', 'Digits', sel('rd', ['5', '6', '7'], '6'))}${field('rr', 'Resets', sel('rr', ['Every financial year', 'Every calendar year', 'Never'], 'Every financial year'))}<div class="ps-field"><span class="ps-field__label">Next request</span><strong class="t-title-md">IR26000095</strong></div></div>`);

  /* 3. ERP sync */
  const erpTab = () => `<section class="ps-kpis" aria-label="Sync status">${[['Connection', 'SAP S/4HANA', 'Connected', 'link', 'success'], ['Synced today', '38', 'items', 'sync', 'info'], ['Pending retry', '2', 'items', 'schedule', 'warning'], ['Last daily reconciliation', '06:00', '0 differences', 'rule', 'success']].map(([l, v, s, i, t]) => `<div class="ps-kpi ps-tile ps-kpi--${t}"><div class="ps-kpi__head"><span class="ps-kpi__label">${l}</span><span class="ps-kpi__icon"><span class="ms" aria-hidden="true">${i}</span></span></div><div class="ps-kpi__value">${v}</div><div class="ps-kpi__sub">${s}</div></div>`).join('')}</section>`
    + sec('s3', 'ERP Integration', 'Send approved items to the ERP and keep the ERP material code against the Procuresprint code (BR40).', `<div class="ps-formgrid">${sw('erp-on', 'ERP integration', true, 'Off means Procuresprint keeps codes on its own.')}${field('erp-sys', 'ERP system', sel('erp-sys', ['SAP S/4HANA · PRD 100', 'Oracle Fusion', 'Microsoft Dynamics 365'], 'SAP S/4HANA · PRD 100'))}${field('erp-src', 'Source of truth', sel('erp-src', ['Procuresprint', 'ERP'], 'Procuresprint'), 'ERP changes are pulled in nightly when ERP is the source.')}${field('erp-when', 'Send when', sel('erp-when', ['Final approval', 'MDM approval'], 'Final approval'))}${field('erp-retry', 'Retry failed sync', sel('erp-retry', ['Every 15 min, 6 times', 'Every hour, 3 times'], 'Every 15 min, 6 times'))}${field('erp-alert', 'Alert on failure', '<input class="ps-input" id="erp-alert" value="MDM lead · IT integration team">')}${field('erp-rec', 'Daily reconciliation', sel('erp-rec', ['06:00 IST', '22:00 IST', 'Off'], '06:00 IST'))}</div>`)
    + sec('s3b', 'Field Mapping', '12 of 52 fields go to the ERP material master.', tbl('ERP field mapping', ['Procuresprint', 'ERP field'], [['Material code (CPN)', 'MATNR'], ['Short description', 'MAKTX'], ['Base unit', 'MEINS'], ['Material type', 'MTART'], ['Material group', 'MATKL'], ['HSN code', 'STEUC'], ['Plant', 'WERKS'], ['Storage location', 'LGORT'], ['Long description', 'MAKTX (long text)'], ['Manufacturer part number', 'MFRPN'], ['Country of origin', 'HERKL'], ['Standard price', 'STPRS']].map(([a, b]) => [U.esc(a), `<code>${b}</code>`])), '<button type="button" class="ps-btn ps-btn--secondary" data-todo><span class="ms" aria-hidden="true">edit</span>Edit mapping</button>')
    + sec('s3c', 'Sync Queue', 'Items stay Active while a sync is pending. Failures retry on their own and alert the admin (EC26).', tbl('Sync queue', ['Item', 'Description', 'ERP code', 'Time', 'Result', 'Message', ''], [['A-200245', 'LAPTOP, LENOVO THINKPAD T14, 16GB', '10004712', 'Today 11:42', U.chip('success', 'Synced'), 'ERP sync complete', ''], ['G-100412', 'HELMET, SAFETY, WHITE, VENTED', '10003985', 'Today 11:10', U.chip('success', 'Synced'), 'Update applied', ''], ['S-200031', 'SERVICE, LAPTOP ANNUAL REPAIR', '—', 'Today 10:55', U.chip('warning', 'Retrying 3 of 6'), 'ERP timeout after 30 s', '<button type="button" class="ps-btn ps-btn--text ps-btn--sm" data-retry>Retry</button>'], ['G-100909', 'CABLE, HDMI, 2 M', '—', 'Today 09:20', U.chip('danger', 'Failed'), 'Material group IT-AC not in ERP', '<button type="button" class="ps-btn ps-btn--text ps-btn--sm" data-retry>Retry</button>']]), '<button type="button" class="ps-btn ps-btn--secondary" data-retry><span class="ms" aria-hidden="true">refresh</span>Retry all failed</button>');

  /* 4. audit */
  const auditTab = () => sec('s4', 'Audit Log', 'Every change to an item or a request: who, when, old value and new value (AC19). Read only. Kept for 7 years.',
    `<div class="ps-formgrid">${field('au-i', 'Item or request', '<input class="ps-input" id="au-i" value="G-100412">')}${field('au-w', 'Changed by', sel('au-w', ['Anyone', 'MDM team', 'System', 'Requesters'], 'Anyone'))}${field('au-a', 'Action', sel('au-a', ['All actions', 'Requested', 'Updated', 'Approved', 'Blocked', 'Unblocked', 'ERP sync'], 'All actions'))}${field('au-f', 'From', '<input class="ps-input" id="au-f" type="date" value="2026-11-01">')}${field('au-t', 'To', '<input class="ps-input" id="au-t" type="date" value="2026-11-26">')}</div>`
    + tbl('Audit log', ['When', 'Who', 'Action', 'Field', 'Old value', 'New value', 'Via'], [['26 Nov · 11:10', 'System', 'ERP sync', 'ERP material code', '10003985', '10003985 · confirmed', 'ERP'], ['26 Nov · 11:08', 'Ananya Rao', 'Approved', 'Request IR26000091', 'Pending approval', 'Completed', 'Portal'], ['26 Nov · 10:40', 'Priya Nair · MDM', 'Updated', 'Short description', 'HELMET, SAFETY, WHITE', 'HELMET, SAFETY, WHITE, VENTED', 'Portal'], ['26 Nov · 10:40', 'Priya Nair · MDM', 'Updated', 'Manufacturer part number', 'PN-501', 'PN-521', 'Portal'], ['26 Nov · 10:40', 'Priya Nair · MDM', 'Updated', 'GTIN', '—', '8901234500127', 'Portal'], ['25 Nov · 16:02', 'John Doe', 'Requested', 'Request IR26000091', '—', 'Update · 3 fields', 'Ask Me'], ['20 Nov · 15:30', 'MDM team', 'Unblocked', 'Status · CHN1', 'Blocked', 'Active', 'Bulk upload'], ['12 Nov · 09:14', 'MDM team', 'Blocked', 'Status · CHN1', 'Active', 'Blocked · quality hold', 'Portal']].map(r => r.map(U.esc))), '<button type="button" class="ps-btn ps-btn--secondary" data-todo><span class="ms" aria-hidden="true">download</span>Export</button>');

  /* 5. general */
  const genTab = () => sec('s5', 'Workflow', 'MDM review is always on. Approval levels come from the approval module.', `<div class="ps-formgrid">${sw('g-rev', 'Review step', true, 'Requests that match the rule go to a reviewer before MDM. Requesters cannot skip it (BR46).')}${field('g-rule', 'Review rule', sel('g-rule', ['Category: Food ingredients +1', 'Category: Food ingredients', 'Item type: Asset'], 'Category: Food ingredients +1'))}${field('g-rr', 'Reviewer role', sel('g-rr', ['Quality team', 'Category owner'], 'Quality team'))}${sw('g-fin', 'Finance step for assets', true, 'Finance sets asset class and useful life (BR34).')}${field('g-fo', 'Finance step order', sel('g-fo', ['After MDM review', 'Before MDM review'], 'After MDM review'))}${field('g-crit', 'Changes that need approval', sel('g-crit', ['Tax, base unit, category, asset class', 'Any change'], 'Tax, base unit, category, asset class'), 'Other updates need MDM only (BR42).')}</div>`)
    + sec('s5b', 'Duplicate Check', 'Thresholds for the similar-item search while typing and on submit (BR25).', `<div class="ps-formgrid">${field('g-w', 'Warning from', sel('g-w', ['80% match', '85% match', '90% match'], '85% match'), 'Pick the existing item or give a reason.')}${field('g-i', 'Information from', sel('g-i', ['60% match', '70% match', '75% match'], '70% match'), 'Shown, does not stop the request.')}${field('g-m', 'Match on', sel('g-m', ['Description, MPN, GTIN, category', 'Description only'], 'Description, MPN, GTIN, category'))}</div>`)
    + sec('s5c', 'Notifications', 'Email and Teams messages per status (AC13).', tbl('Notifications', ['Status', 'Who', 'Email', 'Teams'], [['Submitted', 'Requester'], ['In review · Pending MDM', 'Reviewer, MDM team'], ['Sent back · Rejected', 'Requester'], ['Completed', 'Requester, MDM team'], ['ERP sync failed', 'Admin, IT integration']].map(([s, w], i) => [s, w, `<label class="ps-check"><input type="checkbox" checked aria-label="Email for ${s}"></label>`, `<label class="ps-check"><input type="checkbox" checked aria-label="Teams for ${s}"></label>`])))
    + sec('s5d', 'Timings and Reminders', 'Per step. Reminder at half the target, escalation after it (EC12).', tbl('Timings', ['Step', 'Target', 'Reminder', 'Escalate to'], [['Review', '48 h', '24 h', 'Quality lead'], ['MDM review', '24 h', '12 h', 'MDM lead'], ['Finance', '24 h', '12 h', 'Finance controller'], ['Approval, per level', '24 h', '24 h', "Approver's manager"], ['Sent back to requester', '48 h', '24 h', 'Auto-withdraw at 7 days']].map(r => r.map(U.esc))))
    + sec('s5e', 'AI and Images', '', `<div class="ps-formgrid">${sw('g-ai', 'AI suggestions on the request form', true, 'Pre-fills fields; the requester confirms before submit.')}${sw('g-ocr', 'Create from documents (OCR)', true, 'Reads supplier PDFs on single and bulk create.')}${sw('g-img', 'Fetch item image by part number', false, 'P1. When off, requesters upload images.')}${field('g-conf', 'Show an AI suggestion when confidence is at least', sel('g-conf', ['60%', '70%', '80%'], '70%'))}</div>`);

  const TABS = [['fields', 'Item Field Configuration', fieldsTab], ['seq', 'Item Sequencing', seqTab], ['erp', 'Item ERP Sync', erpTab], ['audit', 'Item Management Audit', auditTab], ['gen', 'General Settings', genTab]];
  const start = TABS.findIndex(t => t[0] === U.qs.get('tab')); const on = start < 0 ? 0 : start;
  main.innerHTML = `<div class="ps-pagehead"><div class="ps-pagehead__text"><a class="ps-back" href="administration.html"><span class="ms" aria-hidden="true">arrow_back</span>Administration</a><h1 class="t-headline">Item master settings</h1><p class="ps-pagehead__meta">How item requests behave for Mindsprint Digital. Changes apply to new requests.</p></div></div>
    <div class="ps-tabs" role="tablist" aria-label="Item master settings">${TABS.map(([id, label], i) => `<button class="ps-tab" role="tab" id="t-${id}" aria-controls="tp-${id}" aria-selected="${i === on}"${i === on ? '' : ' tabindex="-1"'}>${label}</button>`).join('')}</div>
    ${TABS.map(([id, label, fn], i) => `<div id="tp-${id}" role="tabpanel" aria-labelledby="t-${id}" class="ps-stack" style="gap:16px"${i === on ? '' : ' hidden'}>${fn()}</div>`).join('')}
    <div class="ps-actionbar"><div class="ps-actionbar__sum"><div><span>Company</span><b>Mindsprint Digital · IN01</b></div></div><div class="ps-actionbar__btns"><button type="button" class="ps-btn ps-btn--text" id="discard">Discard</button><button type="button" class="ps-btn ps-btn--primary" id="save"><span class="ms" aria-hidden="true">check</span>Save changes</button></div></div>`;
  main.addEventListener('input', e => { if (e.target.id === 'fq') { const v = e.target.value.toLowerCase(); main.querySelectorAll('#tp-fields tbody tr').forEach(tr => { tr.hidden = v && !tr.cells[1].textContent.toLowerCase().includes(v); }); }
    if (['pfx', 'stf'].includes(e.target.id)) document.getElementById('nxt').textContent = document.getElementById('pfx').value + document.getElementById('stf').value; });
  main.addEventListener('change', e => { if (e.target.matches('.ps-switch input')) e.target.nextElementSibling.textContent = e.target.checked ? 'On' : 'Off'; });
  main.addEventListener('click', e => { if (e.target.closest('#save')) PS.toast('Item master settings saved. They apply to new requests.'); if (e.target.closest('#discard')) location.reload(); if (e.target.closest('[data-retry]')) PS.toast('Retry started. Results appear in the queue.'); if (e.target.closest('[data-edit]')) document.getElementById('s2b').scrollIntoView({ behavior: 'smooth' }); });
}
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
