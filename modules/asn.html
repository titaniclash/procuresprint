window.PAGE = {
  title: 'Advance shipping notices',
  statuses: { draft: ['', 'Draft'], dispatched: ['info', 'Dispatched'], transit: ['warning', 'In transit'], posted: ['success', 'GRN Posted'], grnrejected: ['danger', 'GRN Rejected'] },
  kpis: [
    { label: 'Total shipments', value: '14', sub: '12 supplier · 2 buyer', icon: 'local_shipping', tone: 'info' },
    { label: 'ASN drafted', value: '2', sub: 'Awaiting dispatch', icon: 'edit_note', tone: 'brand', match: 'draft' },
    { label: 'In transit', value: '9', sub: '2 arriving this week', icon: 'conveyor_belt', tone: 'warning', match: 'transit' },

  tableTitle: 'All shipments', search: 'Search ASN, PO, or company…', total: 14, pages: 2,

    { key: 'co', label: 'Company', sort: true },
    { key: 'by', label: 'Created By' },
    { key: 'sent', label: 'Dispatched', sort: true, sortVal: r => r.id },

    { label: 'View ASN', icon: 'visibility', preview: r.id },
    ['dispatched', 'transit'].includes(r.status) ? { label: 'Record receipt (GRN)', icon: 'inventory', href: 'grn-receive.html' } : null,
    r.status === 'draft' ? { label: 'Edit draft', icon: 'edit' } : null,
    { label: 'Track shipment', icon: 'pin_drop' },
    { label: 'Download packing list', icon: 'download', toast: `${r.id} packing list downloaded` },
    r.status === 'draft' ? '-' : null, r.status === 'draft' ? { label: 'Delete draft', icon: 'delete', danger: true } : null,
  ],
  preview: {
    title: r => r.id, sub: r => `${r.po} · ${r.co}`,
    fields: [['Purchase order', r => esc(r.po)], ['Created by', r => esc(r.by)], ['Dispatched', r => esc(r.sent)], ['Expected arrival', r => esc(r.eta)]],
    primary: r => ['dispatched', 'transit'].includes(r.status) ? 'Record receipt' : '', primaryHref: r => 'grn-receive.html',
  },
  note: 'Content from Figma “Advance shipping notices”. The Figma tab “GRN Number” and status “In transit” (not a tab) are kept as designed.',
};
